name: test
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_mailmap.py

  web:
    # The web app in a real browser (Chromium) against fake Google/Microsoft APIs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[web]"
      - run: python -m playwright install --with-deps chromium
      - name: pytest tests/web
        # Failures are also posted as annotations, so they can be read without downloading the log.
        run: |
          set -o pipefail
          pytest -q -rf tests/web 2>&1 | tee pytest.log || {
            grep -E '^(FAILED|E +)' pytest.log | head -30 | sed 's/^/::error::/'
            exit 1
          }
